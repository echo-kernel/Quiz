name: Import official JEE papers
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and HTML parsers
        run: pip install requests beautifulsoup4 pymupdf
      - name: Download official papers and extract page text
        run: python scripts/import_official_papers.py
      - name: Commit downloaded papers and searchable text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers data/papers.json data/paper-text
          if git diff --cached --quiet; then
            echo "No new official papers to commit."
          else
            git commit -m "Import official JEE papers and searchable page text"
            git push
          fi
