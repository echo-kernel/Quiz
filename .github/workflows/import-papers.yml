name: Import official JEE papers
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_official_papers.py'
      - 'scripts/build_question_bank.py'
      - '.github/workflows/import-papers.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"
permissions:
  contents: write
concurrency:
  group: jee-paper-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install PDF and HTML parsers
        run: pip install requests beautifulsoup4 pymupdf
      - name: Download official papers and extract page text
        run: python scripts/import_official_papers.py
      - name: Build question-level bank from extracted PDF text
        run: python scripts/build_question_bank.py
      - name: Commit downloaded papers, text and question bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers data/papers.json data/paper-text data/questions.json
          if git diff --cached --quiet; then
            echo "No new official papers to commit."
          else
            git commit -m "Import official JEE questions and searchable paper text"
            git pull --rebase origin main
            git push
          fi
